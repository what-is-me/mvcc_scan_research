# 实验默认参数；未在此列出的键即为代码默认值，改这里不会改代码。
# 每一行形如 key = value，# 之后为注释。命令行参数可覆盖本文件。
#
# 文件一律以无缓冲方式打开（FILE_FLAG_NO_BUFFERING / O_DIRECT）：缓冲池是
# 唯一的页缓存，让系统页缓存再兜一层，未命中会退化成内存拷贝，命中率就失去
# 意义。代价是页大小必须是扇区大小的整数倍（下面 64 KB 满足）。一次扫描按批
# 预取（深度 16）把单页设备往返摊到整批；间隔取 1000 ms 给扫描留出占空比。
# 具体耗时随机器与介质而异，以实测为准。

page_size_kb = 64
row_size_b = 128
table_rows = 2000000

base_pool_mb = 128
undo_pool_mb = 64
undo_capacity_gb = 16

tp_threads = 8
key_dist = zipf0.8
key_mapping = scattered
rows_per_txn = 1

scan_policy = baseline
scan_interval_ms = 1000
scan_access_mode = scan

replacer = lru
duration_s = 60
results_dir = ./results
