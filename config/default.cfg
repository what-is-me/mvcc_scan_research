# 实验默认参数；未在此列出的键即为代码默认值，改这里不会改代码。
# 每一行形如 key = value，# 之后为注释。命令行参数可覆盖本文件。
#
# io_mode = direct 表示绕过系统页缓存：每一次缓冲池未命中都是一次真实设备读，
# 与磁盘数据库一致。代价是页大小必须是扇区大小的整数倍，且扫描一次要
# ~460 ms（3907 页 x 117 us），所以扫描间隔取 1000 ms。
#
# 若改成 buffered，系统页缓存会把整张表兜住，未命中退化为一次内存拷贝
# （3907 页 x 16 us，约 80 ms）：这代表"工作集常驻内存"的一类系统，
# 此时扫描间隔可收紧到 200 ms。两种口径不可混在一张图里比较。

page_size_kb = 64
io_mode = direct
row_size_b = 128
table_rows = 2000000

base_pool_mb = 128
undo_pool_mb = 64
undo_capacity_gb = 16

tp_threads = 8
key_dist = zipf0.8
key_mapping = scattered
rows_per_txn = 1

scan_policy = baseline
scan_interval_ms = 1000
scan_access_mode = scan

replacer = lru
duration_s = 60
results_dir = ./results
