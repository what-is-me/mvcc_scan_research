# 实验默认参数；未在此列出的键即为代码默认值，改这里不会改代码。
# 每一行形如 key = value，# 之后为注释。命令行参数可覆盖本文件。
#
# page_size_kb 取 64 而非更常见的 8：定位读每次调用有约 7.5-8 us 的固定
# 开销（与块大小几乎无关），8 KB 页下一次全表扫描光 I/O 就超过扫描间隔；
# 64 KB 把调用次数降到 1/8，扫描才不被 I/O 主导。

page_size_kb = 64
row_size_b = 128
table_rows = 2000000

base_pool_mb = 128
undo_pool_mb = 64
undo_capacity_gb = 16

tp_threads = 8
key_dist = zipf0.8
key_mapping = scattered
rows_per_txn = 1

scan_policy = baseline
scan_interval_ms = 200
scan_access_mode = scan

replacer = lru
duration_s = 60
results_dir = ./results
